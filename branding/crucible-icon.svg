<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="glowCore" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FF6B1A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E84D00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C13800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="metalBody" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="50%" stop-color="#A0AEC0"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="moltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA940"/>
      <stop offset="100%" stop-color="#E84D00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="vesselClip">
      <!-- Crucible vessel shape clip -->
      <path d="M30,28 L32,72 Q50,84 68,72 L70,28 Z"/>
    </clipPath>
  </defs>

  <!-- Outer glow halo behind vessel -->
  <ellipse cx="50" cy="68" rx="22" ry="10" fill="#FF6B1A" opacity="0.18" filter="url(#softglow)"/>

  <!-- Crucible vessel body -->
  <path d="M30,28 L32,72 Q50,86 68,72 L70,28 Z"
        fill="url(#metalBody)"
        stroke="url(#rimGrad)"
        stroke-width="1.5"/>

  <!-- Molten material inside -->
  <path d="M34,64 Q50,78 66,64 L65,52 Q50,60 35,52 Z"
        fill="url(#moltGrad)"
        clip-path="url(#vesselClip)"
        filter="url(#glow)"
        opacity="0.95"/>

  <!-- Glow core on molten surface -->
  <ellipse cx="50" cy="60" rx="14" ry="5"
           fill="url(#glowCore)"
           clip-path="url(#vesselClip)"
           filter="url(#glow)"/>

  <!-- Bright molten highlight -->
  <ellipse cx="47" cy="59" rx="5" ry="2"
           fill="#FFD580"
           opacity="0.7"
           filter="url(#glow)"/>

  <!-- Rim of the crucible (top opening) -->
  <ellipse cx="50" cy="28" rx="20" ry="4.5"
           fill="none"
           stroke="url(#rimGrad)"
           stroke-width="2"/>
  <!-- Rim fill for depth -->
  <ellipse cx="50" cy="28" rx="20" ry="4.5"
           fill="#2D3748"
           opacity="0.6"/>

  <!-- Inner rim shadow -->
  <ellipse cx="50" cy="28" rx="18" ry="3"
           fill="#1A202C"
           opacity="0.5"/>

  <!-- Heat shimmer lines rising from vessel -->
  <line x1="42" y1="24" x2="40" y2="14" stroke="#FFA940" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
  <line x1="50" y1="23" x2="50" y2="12" stroke="#FFA940" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
  <line x1="58" y1="24" x2="60" y2="14" stroke="#FFA940" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>

  <!-- Vessel side sheen -->
  <path d="M33,34 Q31,52 33,68"
        fill="none"
        stroke="#4A5568"
        stroke-width="1"
        opacity="0.4"/>
</svg>
