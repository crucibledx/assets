<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <radialGradient id="glowCore2" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FF6B1A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E84D00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C13800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="metalBody2" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </radialGradient>
    <linearGradient id="rimGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="50%" stop-color="#A0AEC0"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="moltGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA940"/>
      <stop offset="100%" stop-color="#E84D00"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#A0AEC0"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="vesselClip2">
      <path d="M16,20 L17.5,54 Q28,62 38.5,54 L40,20 Z"/>
    </clipPath>
  </defs>

  <!-- Background (transparent — works on dark bg) -->

  <!-- === ICON (scaled down, left side) === -->
  <g transform="translate(4, 8)">
    <!-- Outer glow -->
    <ellipse cx="28" cy="52" rx="13" ry="6" fill="#FF6B1A" opacity="0.15" filter="url(#softglow2)"/>

    <!-- Vessel body -->
    <path d="M16,20 L17.5,54 Q28,64 38.5,54 L40,20 Z"
          fill="url(#metalBody2)"
          stroke="url(#rimGrad2)"
          stroke-width="1.2"/>

    <!-- Molten fill -->
    <path d="M19,48 Q28,58 37,48 L36.5,40 Q28,46 19.5,40 Z"
          fill="url(#moltGrad2)"
          clip-path="url(#vesselClip2)"
          filter="url(#glow2)"
          opacity="0.95"/>

    <!-- Glow core -->
    <ellipse cx="28" cy="46" rx="8" ry="3.5"
             fill="url(#glowCore2)"
             clip-path="url(#vesselClip2)"
             filter="url(#glow2)"/>

    <!-- Bright highlight -->
    <ellipse cx="26.5" cy="45" rx="3" ry="1.2"
             fill="#FFD580"
             opacity="0.75"
             filter="url(#glow2)"/>

    <!-- Rim -->
    <ellipse cx="28" cy="20" rx="12" ry="3"
             fill="none"
             stroke="url(#rimGrad2)"
             stroke-width="1.5"/>
    <ellipse cx="28" cy="20" rx="12" ry="3"
             fill="#2D3748"
             opacity="0.6"/>
    <ellipse cx="28" cy="20" rx="10.5" ry="2"
             fill="#1A202C"
             opacity="0.5"/>

    <!-- Heat shimmer -->
    <line x1="24" y1="17" x2="23" y2="10" stroke="#FFA940" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
    <line x1="28" y1="17" x2="28" y2="9"  stroke="#FFA940" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
    <line x1="32" y1="17" x2="33" y2="10" stroke="#FFA940" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- === WORDMARK === -->
  <!-- "crucible" in clean geometric sans, tracking wide -->
  <text x="58" y="51"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="28"
        font-weight="700"
        letter-spacing="3"
        fill="url(#textGrad)">CRUCIBLE</text>

  <!-- Accent line under wordmark — thin amber rule -->
  <line x1="58" y1="57" x2="300" y2="57"
        stroke="#E84D00"
        stroke-width="1.5"
        opacity="0.6"/>

  <!-- Tagline -->
  <text x="58" y="70"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="9"
        font-weight="400"
        letter-spacing="4"
        fill="#718096">AI INFRASTRUCTURE PLATFORM</text>
</svg>
